# Database Identity
POSTGRES_DB=knowledge_base
POSTGRES_USER=knowledge_base_admin
POSTGRES_PASSWORD=pass123!

# Authentication & Security
POSTGRES_HOST_AUTH_METHOD=trust  # Change to scram-sha-256 in production

# Character Encoding
POSTGRES_INITDB_ARGS="--encoding=UTF8 --lc-collate=C --lc-ctype=C"

# Timezone
TZ=UTC

# Connection Settings
POSTGRES_MAX_CONNECTIONS=100
POSTGRES_SUPERUSER=true

# Extension Configuration
POSTGRES_SHARED_PRELOAD_LIBRARIES=pgvector
POSTGRES_EXTENSIONS=vector,uuid-ossp,hstore,btree_gin,pg_trgm