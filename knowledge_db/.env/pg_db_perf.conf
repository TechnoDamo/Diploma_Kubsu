# =============================================================================
# POSTGRESQL PERFORMANCE TUNING (VECTOR-OPTIMIZED)
# =============================================================================

# Memory Configuration
POSTGRES_SHARED_BUFFERS=256MB           # 25% of available RAM
POSTGRES_EFFECTIVE_CACHE_SIZE=1GB       # 75% of available RAM
POSTGRES_WORK_MEM=4MB                   # For sorting operations
POSTGRES_MAINTENANCE_WORK_MEM=64MB      # For VACUUM, CREATE INDEX

# Query Planning
POSTGRES_RANDOM_PAGE_COST=1.1           # Favor index scans (SSD)
POSTGRES_EFFECTIVE_IO_CONCURRENCY=200   # Parallel I/O (SSD)
POSTGRES_FORCE_PARALLEL_MODE=off

# Checkpoint & WAL Settings (Vector Write Optimization)
POSTGRES_CHECKPOINT_TIMEOUT=30min
POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
POSTGRES_WAL_BUFFERS=16MB
POSTGRES_MIN_WAL_SIZE=1GB
POSTGRES_MAX_WAL_SIZE=4GB

# Background Writer
POSTGRES_BGWRITER_DELAY=200ms
POSTGRES_BGWRITER_LRU_MAXPAGES=100
POSTGRES_BGWRITER_LRU_MULTIPLIER=2.0

# Vector-Specific Optimizations
POSTGRES_MAINTENANCE_WORK_MEM=256MB     # Larger for vector index builds
POSTGRES_MAX_PARALLEL_WORKERS=4         # Parallel index builds
POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER=2