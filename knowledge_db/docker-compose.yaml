services:
  postgres-vector:
    image: pgvector/pgvector:pg15
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: ${RESTART_POLICY}
    environment:
      # Database Configuration
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      # Performance Tuning
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
      POSTGRES_RANDOM_PAGE_COST: ${POSTGRES_RANDOM_PAGE_COST}
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: ${POSTGRES_EFFECTIVE_IO_CONCURRENCY}
      
      # Security & Locale
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      TZ: ${TZ}
    
    ports:
      - "${POSTGRES_PORT}:5432"
    
    volumes:
      - postgres_data:${POSTGRES_DATA_DIR}
      - ./backups:${BACKUP_DIR}
      - ./logs:${LOG_DIR}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}
    
    deploy:
      resources:
        limits:
          memory: ${CONTAINER_MEMORY_LIMIT}
          cpus: ${CONTAINER_CPU_LIMIT}
        reservations:
          memory: ${CONTAINER_MEMORY_RESERVATION}
          cpus: ${CONTAINER_CPU_RESERVATION}

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    restart: "no"
    depends_on:
      postgres-vector:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - -dir
      - /workspace/migrations
      - postgres
      - host=postgres-vector port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable
      - up

volumes:
  postgres_data:
