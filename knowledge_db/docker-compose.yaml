services:
  postgres:
    profiles: ["local-postgres"]
    image: postgres:16
    container_name: rag-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_system_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_system}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag-system-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_system} -d ${POSTGRES_DB:-rag_system_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rag-system

volumes:
  rag-system-postgres-data:

networks:
  rag-system:
    name: rag-system
    driver: bridge
