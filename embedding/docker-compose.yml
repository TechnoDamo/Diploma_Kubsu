services:
  embedding:
    profiles: ["local-embedding"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.5}
    container_name: rag-system-embedding
    command:
      - --model-id
      - /data/${EMBEDDING_HF_REPO:-minishlab/potion-base-32M}
      - --hostname
      - 0.0.0.0
      - --port
      - "8000"
      - --pooling
      - ${EMBEDDING_POOLING:-mean}
    ports:
      - "${EMBEDDING_PORT:-8090}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ${EMBEDDING_MODELS_DIR:-${HOME}/.cache/huggingface/hub}:/data
    networks:
      - rag-system

networks:
  rag-system:
    name: rag-system
    driver: bridge
