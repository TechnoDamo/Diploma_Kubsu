<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose deployment status</title>
  <desc id="desc">Polished deployment status dashboard for the prototype infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.56" stop-color="#111827"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 800 56px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 25px Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 18px Arial, sans-serif; fill: #94a3b8; letter-spacing: .12em; }
      .card { fill: url(#card); stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .card-ok { stroke: #16a34a; }
      .name { font: 800 27px Arial, sans-serif; fill: #f8fafc; }
      .purpose { font: 400 18px Arial, sans-serif; fill: #cbd5e1; }
      .meta { font: 400 16px Arial, sans-serif; fill: #94a3b8; }
      .pill { fill: #052e16; stroke: #22c55e; stroke-width: 1.5; }
      .pill-text { font: 800 14px Arial, sans-serif; fill: #86efac; letter-spacing: .08em; }
      .endpoint { fill: #172554; stroke: #3b82f6; stroke-width: 1.4; }
      .endpoint-text { font: 700 14px Arial, sans-serif; fill: #bfdbfe; letter-spacing: .06em; }
      .line { stroke: #38bdf8; stroke-width: 2.2; fill: none; opacity: .74; }
      .line-soft { stroke: #64748b; stroke-width: 2; fill: none; opacity: .45; stroke-dasharray: 8 9; }
      .small { font: 400 15px Arial, sans-serif; fill: #94a3b8; }
      .shell { fill: #020617; stroke: #334155; stroke-width: 2; }
      .shell-text { font: 500 18px Menlo, Consolas, monospace; fill: #d1fae5; }
      .shell-muted { font: 500 18px Menlo, Consolas, monospace; fill: #64748b; }
      .check { font: 900 25px Arial, sans-serif; fill: #22c55e; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <circle cx="1420" cy="70" r="280" fill="#0ea5e9" opacity=".08"/>
  <circle cx="230" cy="980" r="360" fill="#22c55e" opacity=".08"/>

  <text x="90" y="102" class="title">Docker Compose deployment</text>
  <text x="92" y="146" class="subtitle">Prototype infrastructure is deployed and connected through the shared <tspan fill="#e2e8f0" font-weight="700">rag_system</tspan> network</text>
  <text x="1710" y="96" text-anchor="end" class="small">Generated: 2026-05-25 11:52 MSK</text>
  <rect x="1432" y="122" width="278" height="38" rx="19" class="pill"/>
  <text x="1571" y="146" text-anchor="middle" class="pill-text">ALL CORE SERVICES READY</text>

  <text x="90" y="215" class="section">APPLICATION LAYER</text>
  <rect x="90" y="240" width="390" height="160" rx="24" class="card card-ok"/>
  <text x="126" y="294" class="check">✓</text>
  <text x="166" y="294" class="name">rag-system-api</text>
  <text x="126" y="332" class="purpose">REST API, project state, document access</text>
  <text x="126" y="365" class="meta">Port: 8080 • Status: Up 3 days</text>

  <rect x="520" y="240" width="390" height="160" rx="24" class="card card-ok"/>
  <text x="556" y="294" class="check">✓</text>
  <text x="596" y="294" class="name">rag-system-worker</text>
  <text x="556" y="332" class="purpose">Indexing, RAG jobs, contradiction analysis</text>
  <text x="556" y="365" class="meta">Queue worker • Status: Up 3 days</text>

  <rect x="950" y="240" width="390" height="160" rx="24" class="card card-ok"/>
  <text x="986" y="294" class="check">✓</text>
  <text x="1026" y="294" class="name">Frontend</text>
  <text x="986" y="332" class="purpose">User interface and API client</text>
  <text x="986" y="365" class="meta">Next.js app • X-Client-Id enabled</text>

  <text x="90" y="475" class="section">DATA, SEARCH AND FILE STORAGE</text>
  <rect x="90" y="500" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="126" y="556" class="check">✓</text>
  <text x="166" y="556" class="name">PostgreSQL</text>
  <text x="126" y="594" class="purpose">Application state and job metadata</text>
  <text x="126" y="627" class="meta">Port: 5432 • Health: healthy</text>

  <rect x="520" y="500" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="556" y="556" class="check">✓</text>
  <text x="596" y="556" class="name">Qdrant</text>
  <text x="556" y="594" class="purpose">Dense vectors, BM25 sparse vectors, RRF</text>
  <text x="556" y="627" class="meta">Port: 6333 • Hybrid retrieval</text>

  <rect x="950" y="500" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="986" y="556" class="check">✓</text>
  <text x="1026" y="556" class="name">MinIO</text>
  <text x="986" y="594" class="purpose">S3-compatible file storage profile</text>
  <text x="986" y="627" class="meta">Ports: 9000 / 9001 • Bucket initialized</text>

  <rect x="1380" y="500" width="330" height="170" rx="24" class="card card-ok"/>
  <text x="1416" y="556" class="check">✓</text>
  <text x="1456" y="556" class="name">Docling</text>
  <text x="1416" y="594" class="purpose">Document text extraction</text>
  <text x="1416" y="627" class="meta">Port: 5001 • Status: Up 3 days</text>

  <text x="90" y="745" class="section">AI AND OBSERVABILITY</text>
  <rect x="90" y="770" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="126" y="826" class="check">✓</text>
  <text x="166" y="826" class="name">TEI / Embeddings</text>
  <text x="126" y="864" class="purpose">Embedding endpoint for indexing and search</text>
  <text x="126" y="897" class="meta">OpenAI-compatible profile configured</text>

  <rect x="520" y="770" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="556" y="826" class="check">✓</text>
  <text x="596" y="826" class="name">vLLM / LLM API</text>
  <text x="556" y="864" class="purpose">Answer generation and pair judging</text>
  <text x="556" y="897" class="meta">OpenAI-compatible profile configured</text>

  <rect x="950" y="770" width="390" height="170" rx="24" class="card card-ok"/>
  <text x="986" y="826" class="check">✓</text>
  <text x="1026" y="826" class="name">Graylog</text>
  <text x="986" y="864" class="purpose">Centralized log viewing</text>
  <text x="986" y="897" class="meta">Port: 19000 • Health: healthy</text>

  <rect x="1380" y="770" width="330" height="170" rx="24" class="card card-ok"/>
  <text x="1416" y="826" class="check">✓</text>
  <text x="1456" y="826" class="name">Log backend</text>
  <text x="1416" y="864" class="purpose">MongoDB + Elasticsearch</text>
  <text x="1416" y="897" class="meta">Graylog dependencies running</text>

  <path class="line" d="M480 318 C520 318 490 318 520 318"/>
  <path class="line" d="M910 318 C950 318 920 318 950 318"/>
  <path class="line" d="M285 400 C285 455 285 455 285 500"/>
  <path class="line" d="M715 400 C715 455 715 455 715 500"/>
  <path class="line" d="M715 400 C900 445 975 455 1145 500"/>
  <path class="line" d="M715 400 C1070 420 1290 455 1545 500"/>
  <path class="line-soft" d="M715 400 C545 560 375 675 285 770"/>
  <path class="line-soft" d="M715 400 C715 560 715 675 715 770"/>
  <path class="line-soft" d="M910 318 C1040 500 1115 640 1145 770"/>
  <path class="line-soft" d="M910 318 C1280 460 1490 620 1545 770"/>

  <rect x="90" y="990" width="1620" height="76" rx="22" class="shell"/>
  <text x="126" y="1026" class="shell-muted">$</text>
  <text x="150" y="1026" class="shell-text">docker compose ps</text>
  <text x="126" y="1054" class="shell-text">api, worker, postgres, qdrant, docling, minio, graylog, mongodb, elasticsearch — running / healthy</text>

  <rect x="1410" y="240" width="300" height="160" rx="24" fill="#06111f" stroke="#1e293b" stroke-width="2"/>
  <text x="1560" y="294" text-anchor="middle" class="section">NETWORK</text>
  <text x="1560" y="336" text-anchor="middle" class="name">rag_system</text>
  <text x="1560" y="368" text-anchor="middle" class="meta">shared Docker network</text>
</svg>
