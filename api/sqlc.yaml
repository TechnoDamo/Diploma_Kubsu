version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "../knowledge_db/migrations/00001_initial_schema.sql"
      - "../knowledge_db/migrations/00002_seed_embedding_models.sql"
    queries: "./sql/queries"
    gen:
      go:
        package: "dbgen"
        out: "./internal/infra/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true

