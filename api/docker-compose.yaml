services:
  api:
    image: ${API_IMAGE:-mimir-api:local}
    build:
      context: .
    container_name: mimir-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/huggingface
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://mimir:mimir@postgres:5432/mimir_db}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      FILES_ROOT_DIR: /app/storage
      PROMPTS_DIR: /app/prompts
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://docling:5001}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-300}
      USE_DOCLING: ${USE_DOCLING:-true}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-25}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-mimir_project}
      QDRANT_ON_DISK_PAYLOAD: ${QDRANT_ON_DISK_PAYLOAD:-true}
      SPARSE_VECTOR_ENABLED: ${SPARSE_VECTOR_ENABLED:-true}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_HTTP_TIMEOUT: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_DELAY: ${LLM_RETRY_DELAY:-5}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_TYPE: ${EMBEDDING_API_TYPE:-openai_compatible}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_RETRY_DELAY: ${EMBEDDING_RETRY_DELAY:-5}
      TEI_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
      TEI_HTTP_TIMEOUT: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      TEI_EMBED_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      MAX_EMBEDDING_CONCURRENT_REQUESTS: ${MAX_EMBEDDING_CONCURRENT_REQUESTS:-2}
      PROJECT_INDEX_DEFAULTS_EMBEDDING_MODEL_NAME: ${PROJECT_INDEX_DEFAULTS_EMBEDDING_MODEL_NAME:-qwen/qwen3-embedding-4b}
      PROJECT_INDEX_DEFAULTS_EMBEDDING_DIMENSION: ${PROJECT_INDEX_DEFAULTS_EMBEDDING_DIMENSION:-2560}
      PROJECT_INDEX_DEFAULTS_CHUNK_SIZE: ${PROJECT_INDEX_DEFAULTS_CHUNK_SIZE:-1200}
      PROJECT_INDEX_DEFAULTS_CHUNK_OVERLAP: ${PROJECT_INDEX_DEFAULTS_CHUNK_OVERLAP:-200}
      RAG_DENSE_WEIGHT: ${RAG_DENSE_WEIGHT:-0.7}
      RAG_SPARSE_WEIGHT: ${RAG_SPARSE_WEIGHT:-0.3}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-5}
      CONTRADICTION_DENSE_WEIGHT: ${CONTRADICTION_DENSE_WEIGHT:-0.3}
      CONTRADICTION_SPARSE_WEIGHT: ${CONTRADICTION_SPARSE_WEIGHT:-0.7}
      CONTRADICTION_TOP_K: ${CONTRADICTION_TOP_K:-20}
      CONTRADICTION_MAX_DISTANCE: ${CONTRADICTION_MAX_DISTANCE:-0.8}
      CONTRADICTION_MAX_CANDIDATES_PER_TARGET: ${CONTRADICTION_MAX_CANDIDATES_PER_TARGET:-40}
      CONTRADICTION_MAX_PAIRS_PER_JOB: ${CONTRADICTION_MAX_PAIRS_PER_JOB:-100}
      MAX_CONTRADICTION_RETRIEVAL_CONCURRENT_TARGETS: ${MAX_CONTRADICTION_RETRIEVAL_CONCURRENT_TARGETS:-4}
      MAX_CONTRADICTION_LLM_CONCURRENT_REQUESTS: ${MAX_CONTRADICTION_LLM_CONCURRENT_REQUESTS:-9}
      GRAYLOG_ENABLED: ${GRAYLOG_ENABLED:-true}
      GRAYLOG_HOST: ${GRAYLOG_HOST:-graylog}
      GRAYLOG_PORT: ${GRAYLOG_PORT:-12201}
      GENERATE_SUMMARY: ${GENERATE_SUMMARY:-true}
      SUMMARY_SEGMENT_SIZE: ${SUMMARY_SEGMENT_SIZE:-10000}
      MAX_SUMMARY_LLM_CONCURRENT_REQUESTS: ${MAX_SUMMARY_LLM_CONCURRENT_REQUESTS:-3}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
    volumes:
      - ./app:/app/app:delegated
      - ./prompts:/app/prompts
      - mimir_files:/app/storage
      - hf_cache:/root/.cache/huggingface
    networks:
      - mimir

  worker:
    image: ${API_IMAGE:-mimir-api:local}
    container_name: mimir-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false
    command: ["python", "-m", "app.worker.worker"]
    environment:
      FASTEMBED_CACHE_PATH: /root/.cache/huggingface
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://mimir:mimir@postgres:5432/mimir_db}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
      FILES_ROOT_DIR: /app/storage
      PROMPTS_DIR: /app/prompts
      DOCLING_BASE_URL: ${DOCLING_BASE_URL:-http://docling:5001}
      DOCLING_TIMEOUT_SECONDS: ${DOCLING_TIMEOUT_SECONDS:-300}
      USE_DOCLING: ${USE_DOCLING:-true}
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-25}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-mimir_project}
      QDRANT_ON_DISK_PAYLOAD: ${QDRANT_ON_DISK_PAYLOAD:-true}
      SPARSE_VECTOR_ENABLED: ${SPARSE_VECTOR_ENABLED:-true}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_HTTP_TIMEOUT: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_DELAY: ${LLM_RETRY_DELAY:-5}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-minishlab/potion-base-32M}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-256}
      EMBEDDING_API_TYPE: ${EMBEDDING_API_TYPE:-openai_compatible}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_RETRY_DELAY: ${EMBEDDING_RETRY_DELAY:-5}
      TEI_BASE_URL: ${EMBEDDING_BASE_URL:-https://routerai.ru/api/v1}
      TEI_HTTP_TIMEOUT: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      TEI_EMBED_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      MAX_EMBEDDING_CONCURRENT_REQUESTS: ${MAX_EMBEDDING_CONCURRENT_REQUESTS:-2}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL_SECONDS:-3}
      PROJECT_INDEX_DEFAULTS_EMBEDDING_MODEL_NAME: ${PROJECT_INDEX_DEFAULTS_EMBEDDING_MODEL_NAME:-qwen/qwen3-embedding-4b}
      PROJECT_INDEX_DEFAULTS_EMBEDDING_DIMENSION: ${PROJECT_INDEX_DEFAULTS_EMBEDDING_DIMENSION:-2560}
      PROJECT_INDEX_DEFAULTS_CHUNK_SIZE: ${PROJECT_INDEX_DEFAULTS_CHUNK_SIZE:-1200}
      PROJECT_INDEX_DEFAULTS_CHUNK_OVERLAP: ${PROJECT_INDEX_DEFAULTS_CHUNK_OVERLAP:-200}
      CONTRADICTION_DENSE_WEIGHT: ${CONTRADICTION_DENSE_WEIGHT:-0.3}
      CONTRADICTION_SPARSE_WEIGHT: ${CONTRADICTION_SPARSE_WEIGHT:-0.7}
      CONTRADICTION_TOP_K: ${CONTRADICTION_TOP_K:-20}
      CONTRADICTION_MAX_DISTANCE: ${CONTRADICTION_MAX_DISTANCE:-0.8}
      CONTRADICTION_MAX_CANDIDATES_PER_TARGET: ${CONTRADICTION_MAX_CANDIDATES_PER_TARGET:-40}
      CONTRADICTION_MAX_PAIRS_PER_JOB: ${CONTRADICTION_MAX_PAIRS_PER_JOB:-100}
      MAX_CONTRADICTION_RETRIEVAL_CONCURRENT_TARGETS: ${MAX_CONTRADICTION_RETRIEVAL_CONCURRENT_TARGETS:-4}
      MAX_CONTRADICTION_LLM_CONCURRENT_REQUESTS: ${MAX_CONTRADICTION_LLM_CONCURRENT_REQUESTS:-9}
      GENERATE_SUMMARY: ${GENERATE_SUMMARY:-true}
      SUMMARY_SEGMENT_SIZE: ${SUMMARY_SEGMENT_SIZE:-10000}
      MAX_SUMMARY_LLM_CONCURRENT_REQUESTS: ${MAX_SUMMARY_LLM_CONCURRENT_REQUESTS:-3}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
      GRAYLOG_ENABLED: ${GRAYLOG_ENABLED:-true}
      GRAYLOG_HOST: ${GRAYLOG_HOST:-graylog}
      GRAYLOG_PORT: ${GRAYLOG_PORT:-12201}
    volumes:
      - ./app:/app/app:delegated
      - ./prompts:/app/prompts
      - mimir_files:/app/storage
      - hf_cache:/root/.cache/huggingface
    networks:
      - mimir

volumes:
  mimir_files:
  hf_cache:

networks:
  mimir:
    name: mimir
    driver: bridge
