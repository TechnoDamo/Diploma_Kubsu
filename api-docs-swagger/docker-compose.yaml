version: '3.8'

services:
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8080:8080"
    environment:
      URLS: |
        [
          {"url": "/specs/embedding-service.yaml", "name": "Embedding Service"},
          {"url": "/specs/comparison-service.yaml", "name": "Document Comparisons Service"}
        ]
    volumes:
      - ./specs:/usr/share/nginx/html/specs:ro