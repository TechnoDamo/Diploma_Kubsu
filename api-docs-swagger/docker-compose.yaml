version: '3.8'

services:
  prism:
    image: stoplight/prism:4
    command: mock -h 0.0.0.0 /tmp/specs/mimir-rag-api.yaml
    ports:
      - "8080:4010"
    volumes:
      - ./specs:/tmp/specs:ro

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8081:8080"
    environment:
      URLS: |
        [
          {"url": "/specs/mimir-rag-api.yaml", "name": "Mimir RAG API"}
        ]
    volumes:
      - ./specs:/usr/share/nginx/html/specs:ro
