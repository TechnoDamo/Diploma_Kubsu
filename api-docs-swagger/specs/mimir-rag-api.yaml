openapi: 3.1.0
info:
  title: Mimir RAG API
  version: 1.3.0
  summary: HTTP API для проектов, документов, RAG-запросов и анализа противоречий
  description: |
    Актуальная спецификация публичного API Mimir.

    Базовая модель работы:
    - проект объединяет документы в отдельную базу знаний;
    - загрузка документа создаёт фоновую задачу индексации;
    - RAG-запросы работают только по документам со статусом `indexed`;
    - анализ противоречий запускается асинхронно и опрашивается по `job_id`.

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный backend

tags:
  - name: Projects
    description: Проекты, то есть отдельные базы знаний.
  - name: Documents
    description: Загрузка, удаление и получение документов.
  - name: Content
    description: Оригинальный файл и извлечённый текст.
  - name: RAG
    description: Вопросы по проиндексированным документам проекта.
  - name: Retrieval
    description: Отладочный retrieval без генерации ответа LLM.
  - name: Analysis
    description: Асинхронный поиск противоречий между документами.

paths:
  /projects:
    get:
      tags: [Projects]
      summary: Список проектов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Проекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
    post:
      tags: [Projects]
      summary: Создать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '409':
          description: Проект с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Получить проект
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Удалить проект
      responses:
        '204':
          description: Проект удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Проект занят активными задачами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Documents]
      summary: Список документов проекта
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Документы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
    post:
      tags: [Documents]
      summary: Загрузить документ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                display_name:
                  type: string
                  nullable: true
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Документ принят и поставлен в очередь индексации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '413':
          description: Файл превышает лимит размера
        '415':
          description: Формат файла не поддерживается

  /projects/{project_id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Метаданные документа
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      summary: Удалить документ
      responses:
        '204':
          description: Документ удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Документ занят активной задачей

  /projects/{project_id}/documents/{document_id}/text:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Content]
      summary: Извлечённый текст документа
      responses:
        '200':
          description: Текст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentText'
        '409':
          description: Текст ещё недоступен, индексация не завершена

  /projects/{project_id}/documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Content]
      summary: Скачать оригинальный файл
      responses:
        '200':
          description: Оригинальные байты файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project_id}/rag/query:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [RAG]
      summary: Задать вопрос по документам проекта
      description: |
        Если `target_document_ids` не передан, поиск идёт по всем документам проекта
        со статусом `indexed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagQuery'
      responses:
        '200':
          description: Ответ RAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagAnswer'

  /projects/{project_id}/retrieval/query:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Retrieval]
      summary: Найти Qdrant points по raw text
      description: |
        Endpoint векторизует переданный `text`, выполняет dense, sparse или hybrid
        retrieval по Qdrant и возвращает структурированный список найденных points
        без обращения к LLM. `dense_weight` и `sparse_weight` управляют участием
        веток: оба значения больше нуля включают Qdrant prefetch + weighted RRF
        fusion, нулевое значение отключает соответствующую ветку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalQuery'
      responses:
        '200':
          description: Найденные Qdrant points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalAnswer'

  /projects/{project_id}/analysis/contradictions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Analysis]
      summary: Список задач анализа противоречий
      responses:
        '200':
          description: Задачи анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobList'
    post:
      tags: [Analysis]
      summary: Запустить анализ противоречий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysis'
      responses:
        '202':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '409':
          description: Базовый документ не готов или проект занят

  /projects/{project_id}/analysis/contradictions/{job_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Analysis]
      summary: Статус и результат задачи анализа
      responses:
        '200':
          description: Задача анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string

    Project:
      type: object
      required: [id, name, document_count, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        document_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CreateProject:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true

    Document:
      type: object
      required: [id, project_id, name, size_bytes, mime_type, status, created_at, updated_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        size_bytes:
          type: integer
        mime_type:
          type: string
        status:
          type: string
          enum: [uploaded, processing, indexed, failed]
        summary:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    DocumentText:
      type: object
      required: [document_id, text]
      properties:
        document_id:
          type: integer
        text:
          type: string

    RagQuery:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
        target_document_ids:
          type: array
          nullable: true
          items:
            type: integer

    Citation:
      type: object
      required: [document_id, document_name, snippet]
      properties:
        document_id:
          type: integer
        document_name:
          type: string
        snippet:
          type: string

    RagAnswer:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        warning_message:
          type: string
          nullable: true
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'

    RetrievalQuery:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        target_document_ids:
          type: array
          nullable: true
          items:
            type: integer
        dense_weight:
          type: number
          minimum: 0
          nullable: true
        sparse_weight:
          type: number
          minimum: 0
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
        include_text:
          type: boolean
          default: true
        include_payload:
          type: boolean
          default: true

    RetrievalPoint:
      type: object
      required: [point_id]
      properties:
        point_id:
          type: string
        score:
          type: number
          nullable: true
        distance:
          type: number
          nullable: true
        document_id:
          type: integer
          nullable: true
        chunk_id:
          type: integer
          nullable: true
        chunk_order:
          type: integer
          nullable: true
        char_start:
          type: integer
          nullable: true
        char_end:
          type: integer
          nullable: true
        text_preview:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
          additionalProperties: true

    RetrievalAnswer:
      type: object
      required: [query_text, collection_name, retrieval_mode, dense_weight, sparse_weight, sparse_vector_enabled, limit, points]
      properties:
        query_text:
          type: string
        collection_name:
          type: string
        retrieval_mode:
          type: string
          enum: [dense, sparse, hybrid]
        dense_weight:
          type: number
        sparse_weight:
          type: number
        sparse_vector_enabled:
          type: boolean
        limit:
          type: integer
        points:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalPoint'

    StartAnalysis:
      type: object
      required: [base_document_id]
      properties:
        base_document_id:
          type: integer
          minimum: 1
        target_document_ids:
          type: array
          nullable: true
          items:
            type: integer

    AnalysisAccepted:
      type: object
      required: [job_id, status, poll_url]
      properties:
        job_id:
          type: integer
        status:
          type: string
        poll_url:
          type: string
        warning_message:
          type: string
          nullable: true

    AnalysisJob:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: integer
        status:
          type: string
          enum: [queued, processing, completed, failed]
        poll_url:
          type: string
          nullable: true
        warning_message:
          type: string
          nullable: true
        results:
          nullable: true
        error_message:
          type: string
          nullable: true

    AnalysisJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
