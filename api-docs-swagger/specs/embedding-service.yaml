openapi: 3.0.3
info:
  title: Embedding Service API
  description: Convert documents and text to vector embeddings
  version: 1.0.0
  
servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.company.com/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check
      description: Check if the service is running and healthy
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/internal/parse/document:
    post:
      summary: Parse document content
      description: Extract raw text content from various document formats
      operationId: parseDocument
      tags:
        - Document Processing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file to parse
                chunkSizeChars: 
                  type: integer 
                  description: Size of chunks 
      responses:
        '200':
          description: Document successfully parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/internal/create/chunks:
    post:
      summary: Create text chunks from document text
      description: Split document text into manageable chunks with overlap
      operationId: createChunks
      tags:
        - Document Processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
                - chunkSizeChars
                - chunkOverlapChars
              properties:
                text:
                  type: string
                  description: Document text to chunk
                chunkSizeChars:
                  type: integer
                  description: Char size for text chunks
                chunkOverlapChars:
                  type: integer
                  description: Amount of charachters for chunk overlap 
      responses:
        '200':
          description: Document successfully chunked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/internal/embed/chunks:
    post:
      summary: Convert document chunks to vector embeddings
      description: Convert pre-chunked text or document into vector embeddings
      operationId: vectoriseDocument
      tags:
        - Embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chunks
              properties:
                chunks:
                  type: array
                  items: 
                    type: object
                    required:
                      - chunkId 
                      - chunkText
                    properties:
                      chunkId:
                        type: integer
                      chunkText:
                        type: string 

                model:
                  type: string
                  enum: [e5-small, e5-base, e5-large, multilingual]
                  default: e5-small
      responses:
        '200':
          description: Document successfully vectorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        modelLoaded:
          type: boolean
        uptimeSeconds:
          type: number
          format: float

    ParseResponse:
      type: object
      required:
        - content
        - metadata
      properties:
        content:
          type: string
          description: Extracted text content from document
        metadata:
          type: object
          properties:
            pages:
              type: integer
              description: Number of pages in document
            fileType:
              type: string
              description: Original file type
            fileSizeBytes:
              type: integer
              description: File size in bytes              
            wordCount:
              type: number
              format: float

    Chunk:
      type: object
      required:
        - chunkId
        - chunkText
      properties:
        chunkId:
          type: integer
          description: Unique identifier for the chunk
        chunkText:
          type: string
          description: The text content of the chunk
        charCount:
          type: integer 
          description: Amount of charachters in the chunk 
        
    ChunkResponse:
      type: object
      required:
        - chunks
        - chunkOverlapChars
        - totalChunks
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        totalChunks:
          type: integer
          description: Total number of chunks created
        chunkSizeChars:
          type: integer
          description:  size for text chunks
        chunkOverlapChars:
          type: integer
          description: Amount of charachters for chunk overlap 

    EmbedResponse:
      type: object
      required:
        - embeddings
        - model 
        - dimensions
      properties:
        embeddings:
          type: array
          items:
            type: object
            required:
              - embeddingId
              - embeddingText
              - embedding
            properties:
              embeddingId:
                type: integer
              embeddingText:
                type: string
              embedding:
                type: array
                items:
                  type: number
                description: Vector embedding for this chunk
        totalEmbeddings:
          type: integer
        embeddingTextSizeBytes:
          type: integer
        model:
          type: string
        dimensions:
          type: integer

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
        message:
          type: string

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - apiKey: []