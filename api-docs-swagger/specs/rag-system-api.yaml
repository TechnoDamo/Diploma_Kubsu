openapi: 3.1.0
info:
  title: RAG System RAG API
  version: 1.0.0
  summary: HTTP API для проектов, документов, RAG-запросов и анализа противоречий
  description: Контракт синхронизирован с FastAPI-приложением в `api/app`.

tags:
  - name: health
    description: Health/readiness/liveness endpoints.
  - name: projects
    description: Проекты, то есть отдельные базы знаний.
  - name: documents
    description: Загрузка, удаление, получение документов и их содержимого.
  - name: rag
    description: Вопросы по проиндексированным документам проекта.
  - name: retrieval
    description: Отладочный retrieval без генерации ответа LLM.
  - name: analysis
    description: Асинхронный поиск противоречий между документами.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Basic health check
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /healthz/ready:
    get:
      tags: [health]
      summary: Readiness check
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /healthz/live:
    get:
      tags: [health]
      summary: Liveness check with dependencies
      responses:
        '200':
          description: API liveness and dependency status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'

  /api/v1/projects:
    get:
      tags: [projects]
      summary: Список проектов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Проекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [projects]
      summary: Создать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '409':
          description: Проект с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Получить проект
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [projects]
      summary: Удалить проект
      responses:
        '204':
          description: Проект удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Проект занят активными задачами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [documents]
      summary: Список документов проекта
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Документы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [documents]
      summary: Загрузить документ
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                display_name:
                  anyOf:
                    - type: string
                    - type: 'null'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Документ принят и поставлен в очередь индексации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Файл не был передан в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Проект в процессе переиндексации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Файл превышает лимит размера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Формат файла не поддерживается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Метаданные документа
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [documents]
      summary: Удалить документ
      responses:
        '204':
          description: Документ удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Документ занят активной задачей или проект переиндексируется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/documents/{document_id}/text:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Извлечённый текст документа
      responses:
        '200':
          description: Текст
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentText'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Текст ещё недоступен, индексация не завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/documents/{document_id}/content:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Скачать оригинальный файл
      responses:
        '200':
          description: Оригинальные байты файла; Content-Type равен MIME-типу сохранённого документа
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/rag/query:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [rag]
      summary: Задать вопрос по документам проекта
      description: Если `target_document_ids` не передан, поиск идёт по всем документам проекта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagQuery'
      responses:
        '200':
          description: Ответ RAG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagAnswer'
        '400':
          description: Проект не найден, проект переиндексируется или индекс не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/retrieval/query:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [retrieval]
      summary: Найти Qdrant points по raw text
      description: |
        Endpoint векторизует переданный `text`, выполняет dense, sparse или hybrid
        retrieval по Qdrant и возвращает структурированный список найденных points
        без обращения к LLM. `dense_weight` и `sparse_weight` управляют участием
        веток: оба значения больше нуля включают Qdrant prefetch + weighted RRF
        fusion, нулевое значение отключает соответствующую ветку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalQuery'
      responses:
        '200':
          description: Найденные Qdrant points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalAnswer'
        '400':
          description: Проект не найден, проект переиндексируется, индекс не готов или веса некорректны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/analysis/contradictions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [analysis]
      summary: Список задач анализа противоречий
      parameters:
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
      responses:
        '200':
          description: Задачи анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobList'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [analysis]
      summary: Запустить анализ противоречий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysis'
      responses:
        '202':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '400':
          description: Базовый документ не найден или не проиндексирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/projects/{project_id}/analysis/contradictions/{job_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [analysis]
      summary: Статус и результат задачи анализа
      responses:
        '200':
          description: Задача анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [analysis]
      summary: Удалить задачу анализа
      responses:
        '204':
          description: Задача удалена, если существовала
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: integer
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка валидации запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'

    ValidationIssue:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationErrorResponse:
      type: object
      required: [error, issues]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [rag-system-api]

    Liveness:
      type: object
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          enum: [rag-system-api]
        checks:
          type: object
          required: [database, tei, llm, qdrant]
          properties:
            database:
              type: string
              enum: [ok, error]
            tei:
              type: string
              enum: [ok, error]
            llm:
              type: string
              enum: [ok, error]
            qdrant:
              type: string
              enum: [ok, error]

    Project:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          anyOf:
            - type: string
            - type: 'null'
        document_count:
          type: integer
          default: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CreateProject:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          anyOf:
            - type: string
            - type: 'null'

    Document:
      type: object
      required: [id, project_id, name, size_bytes, mime_type, status, created_at, updated_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        size_bytes:
          type: integer
        mime_type:
          type: string
        status:
          type: string
        summary:
          anyOf:
            - type: string
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    DocumentText:
      type: object
      required: [document_id, text]
      properties:
        document_id:
          type: integer
        text:
          type: string

    RagQuery:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
        target_document_ids:
          anyOf:
            - type: array
              items:
                type: integer
            - type: 'null'

    Citation:
      type: object
      required: [document_id, document_name, snippet]
      properties:
        document_id:
          type: integer
        document_name:
          type: string
        snippet:
          type: string

    RagAnswer:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        warning_message:
          anyOf:
            - type: string
            - type: 'null'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'

    RetrievalQuery:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        target_document_ids:
          anyOf:
            - type: array
              items:
                type: integer
            - type: 'null'
        dense_weight:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        sparse_weight:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
        limit:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
            - type: 'null'
        include_text:
          type: boolean
          default: true
        include_payload:
          type: boolean
          default: true

    RetrievalPoint:
      type: object
      required: [point_id]
      properties:
        point_id:
          type: string
        score:
          anyOf:
            - type: number
            - type: 'null'
        distance:
          anyOf:
            - type: number
            - type: 'null'
        document_id:
          anyOf:
            - type: integer
            - type: 'null'
        chunk_id:
          anyOf:
            - type: integer
            - type: 'null'
        chunk_order:
          anyOf:
            - type: integer
            - type: 'null'
        char_start:
          anyOf:
            - type: integer
            - type: 'null'
        char_end:
          anyOf:
            - type: integer
            - type: 'null'
        text_preview:
          anyOf:
            - type: string
            - type: 'null'
        text:
          anyOf:
            - type: string
            - type: 'null'
        payload:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'

    RetrievalAnswer:
      type: object
      required: [query_text, collection_name, retrieval_mode, dense_weight, sparse_weight, sparse_vector_enabled, limit, points]
      properties:
        query_text:
          type: string
        collection_name:
          type: string
        retrieval_mode:
          type: string
        dense_weight:
          type: number
        sparse_weight:
          type: number
        sparse_vector_enabled:
          type: boolean
        limit:
          type: integer
        points:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalPoint'

    StartAnalysis:
      type: object
      required: [base_document_id]
      properties:
        base_document_id:
          type: integer
          exclusiveMinimum: 0
        target_document_ids:
          anyOf:
            - type: array
              items:
                type: integer
            - type: 'null'

    AnalysisAccepted:
      type: object
      required: [job_id, status, poll_url]
      properties:
        job_id:
          type: integer
        status:
          type: string
        poll_url:
          type: string
        warning_message:
          anyOf:
            - type: string
            - type: 'null'

    AnalysisJob:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: integer
        status:
          type: string
        poll_url:
          anyOf:
            - type: string
            - type: 'null'
        warning_message:
          anyOf:
            - type: string
            - type: 'null'
        results:
          anyOf:
            - {}
            - type: 'null'
        error_message:
          anyOf:
            - type: string
            - type: 'null'

    AnalysisJobListItem:
      type: object
      required: [id, project_id, base_document_id, target_document_ids, status, created_at, updated_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        base_document_id:
          type: integer
        target_document_ids:
          type: array
          items:
            type: integer
        status:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        completed_at:
          anyOf:
            - type: string
            - type: 'null'
        warning_message:
          anyOf:
            - type: string
            - type: 'null'
        results:
          anyOf:
            - {}
            - type: 'null'

    AnalysisJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisJobListItem'
