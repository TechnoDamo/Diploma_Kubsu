services:
  minio:
    profiles: ["local-object-storage"]
    image: minio/minio:latest
    container_name: mimir-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - mimir
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["local-object-storage"]
    image: minio/mc
    container_name: mimir-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb myminio/${MINIO_BUCKET:-mimir-files} --ignore-existing
      "
    networks:
      - mimir
    restart: "no"

volumes:
  minio_data:

networks:
  mimir:
    name: mimir
    driver: bridge
