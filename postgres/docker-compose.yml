services:
  postgres:
    profiles: ["local-postgres"]
    image: postgres:16
    container_name: mimir-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimir}
      POSTGRES_DB: ${POSTGRES_DB:-mimir}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mimir}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mimir

volumes:
  postgres_data:

networks:
  mimir:
    name: mimir
    driver: bridge
